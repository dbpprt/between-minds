{{ define "main" }}
  <main id="content">
    <section class="inner-hero section">
      <div class="container inner-hero-copy">
        <p class="eyebrow">{{ site.Params.tagline }}</p>
        <h1>{{ .Title }}</h1>
        {{ with .Params.description }}
          <p class="hero-intro">{{ . }}</p>
        {{ end }}
      </div>
    </section>
    <section class="section section-tight">
      <article class="container prose-card">
        {{ .Content }}
      </article>
    </section>
  </main>
{{ end }}
